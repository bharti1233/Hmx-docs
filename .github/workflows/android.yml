name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caching only. The Gradle version comes from the committed wrapper
      # (gradle/wrapper/gradle-wrapper.properties, pinned by sha256), so CI runs
      # the same Gradle a clean checkout gets locally.
      - name: Set up Gradle (wrapper cache)
        uses: gradle/actions/setup-gradle@v4

      # Cross-compiles the native PDF bridge so the debug artifact has working PDF tools.
      - name: Build PDF native bridge
        uses: ./.github/actions/build-pdf-bridge

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Record APK checksum
        run: |
          cd build/outputs/apk/debug
          sha256sum *.apk | tee SHA256SUMS.txt
          {
            echo "### Debug APK"
            ls -l *.apk
            cat SHA256SUMS.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kern-debug-apk-${{ github.sha }}
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (wrapper cache)
        uses: gradle/actions/setup-gradle@v4

      # tests/editors and tests/shared are plain JVM tests, so the native PDF
      # bridge is deliberately not built here - it would only slow the job down.
      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      # Uploaded on success too, so the passing test counts are part of the
      # evidence a run leaves behind, not just the failures.
      - name: Upload unit test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: kern-unit-test-report-${{ github.sha }}
          path: |
            build/reports/tests/testDebugUnitTest
            build/test-results/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 14

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (wrapper cache)
        uses: gradle/actions/setup-gradle@v4

      # Applies config/lint.xml, which treats any network API use as an error.
      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Upload lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: kern-lint-report-${{ github.sha }}
          path: |
            build/reports/lint-results-debug.html
            build/reports/lint-results-debug.xml
            build/reports/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 14
