name: Build PDF native bridge
description: >
  Cross-compiles the kern-bridge crate (pure lopdf + jni, no MuPDF) from the Qyra
  fork into jniLibs/<abi>/libkern_pdf.so, so the packaged APK ships the native PDF
  engine and QyraPdf.available is true. See src/pdf-bridge/README.md.

inputs:
  qyra-repo:
    description: Qyra fork repository (owner/name) that holds kern-bridge.
    default: verycareful/Qyra
  qyra-ref:
    description: >
      Git ref (commit sha, tag or branch) of the fork to build from. Defaults to
      the reviewed kern-bridge commit; override only after reviewing the diff.
    # Pinned on purpose: this compiles foreign source into the shipped APK, so the
    # default is a reviewed commit, not the fork's moving `main`.
    # 397a10fd is "feat(android): add kern-bridge JNI crate for Kern (dev.kern)".
    default: 397a10fd155f4503876e7048542699d0248f99b8
  abis:
    description: Space-separated cargo-ndk ABIs to build.
    default: arm64-v8a armeabi-v7a x86_64

runs:
  using: composite
  steps:
    - name: Set up Rust with Android targets
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

    - name: Install cargo-ndk
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-ndk

    - name: Point cargo-ndk at the runner's Android NDK
      shell: bash
      run: echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}" >> "$GITHUB_ENV"

    # `git clone --branch` only accepts branch/tag names, so the ref is fetched
    # explicitly: a commit sha, a tag or a branch all work, and the resolved
    # commit is printed so the log records exactly which source was compiled.
    - name: Fetch kern-bridge from the Qyra fork (sparse)
      shell: bash
      env:
        QYRA_REPO: ${{ inputs.qyra-repo }}
        QYRA_REF: ${{ inputs.qyra-ref }}
      run: |
        git init -q qyra-fork
        cd qyra-fork
        git remote add origin "https://github.com/${QYRA_REPO}.git"
        git sparse-checkout init --cone
        git sparse-checkout set kern-bridge
        git fetch --depth 1 origin "${QYRA_REF}"
        git checkout -q FETCH_HEAD
        echo "kern-bridge source: ${QYRA_REPO}@$(git rev-parse HEAD)"
        test -f kern-bridge/Cargo.toml || { echo "kern-bridge not found in ${QYRA_REPO}@${QYRA_REF}"; exit 1; }

    - name: Build libkern_pdf.so for each ABI
      shell: bash
      run: |
        targets=""
        for abi in ${{ inputs.abis }}; do targets="$targets -t $abi"; done
        cd qyra-fork/kern-bridge
        cargo ndk $targets -o "$GITHUB_WORKSPACE/jniLibs" build --release

    - name: Verify the libraries landed
      shell: bash
      run: |
        test -f "$GITHUB_WORKSPACE/jniLibs/arm64-v8a/libkern_pdf.so"
        ls -R "$GITHUB_WORKSPACE/jniLibs"
